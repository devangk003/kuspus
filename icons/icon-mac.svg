<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    macOS app icon, full-bleed 1024×1024 square: macOS 26+ applies its own squircle mask,
    and an icon with transparent margins is treated as legacy and placed on a light
    squircle (which hides the pale mark). Deep dark surface so the pale-mint bars of the
    brand mark (icons/icon.svg) read on both light and dark Docks; the mark itself is
    unchanged, scaled to ~60 % of the tile. Regenerate KusPus.icns with
    tools/build-mac-icons.sh.
  -->
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232326"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.5" cy="0.92" r="0.6">
      <stop offset="0%" stop-color="#4DDBA6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4DDBA6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mintGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F5F2"/>
      <stop offset="72%" stop-color="#EEF4EE"/>
      <stop offset="100%" stop-color="#CDEFD9"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.302
                0 0 0 0 0.859
                0 0 0 0 0.651
                0 0 0 0.5 0"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#tileBg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#tileGlow)"/>

  <!-- Brand mark (icons/icon.svg geometry), centred, 1.3× (≈58 % of the canvas, inside the system mask) -->
  <g transform="translate(512 512) scale(1.3) translate(-512 -472)">
    <g>
      <rect x="288" y="402" width="64" height="146" rx="32" fill="url(#mintGradient)"/>
      <ellipse cx="320" cy="552" rx="42" ry="18" fill="#4DDBA6" opacity="0.35" filter="url(#softGlow)"/>
    </g>
    <g>
      <rect x="384" y="332" width="64" height="286" rx="32" fill="url(#mintGradient)"/>
      <ellipse cx="416" cy="622" rx="46" ry="20" fill="#4DDBA6" opacity="0.35" filter="url(#softGlow)"/>
    </g>
    <g>
      <rect x="480" y="260" width="64" height="424" rx="32" fill="url(#mintGradient)"/>
      <ellipse cx="512" cy="690" rx="50" ry="22" fill="#4DDBA6" opacity="0.4" filter="url(#softGlow)"/>
    </g>
    <g>
      <rect x="576" y="332" width="64" height="286" rx="32" fill="url(#mintGradient)"/>
      <ellipse cx="608" cy="622" rx="46" ry="20" fill="#4DDBA6" opacity="0.35" filter="url(#softGlow)"/>
    </g>
    <g>
      <rect x="672" y="402" width="64" height="146" rx="32" fill="url(#mintGradient)"/>
      <ellipse cx="704" cy="552" rx="42" ry="18" fill="#4DDBA6" opacity="0.35" filter="url(#softGlow)"/>
    </g>
  </g>
</svg>
